<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Kerbmusik</title>
  <rect width="512" height="512" fill="#8f1d21"/>
  <g transform="translate(16,16) scale(1.2)">
  <defs>
    <path id="oben" d="M 56,200 A 144 144 0 0 1 344,200"/>
    <path id="unten" d="M 31,200 A 169 169 0 0 0 369,200"/>
    <clipPath id="scheibe"><circle cx="200" cy="200" r="128"/></clipPath>
  </defs>

  <!-- Ring -->
  <circle cx="200" cy="200" r="192" fill="#8f1d21"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#f6ecd6" stroke-width="2"/>
  <circle cx="200" cy="200" r="132" fill="none" stroke="#f6ecd6" stroke-width="2"/>
  <circle cx="200" cy="200" r="128" fill="#f6ecd6"/>

  <!-- Schrift -->
  <text font-family="Rockwell, Georgia, serif" font-weight="700" font-size="36" letter-spacing="10" fill="#f6ecd6" text-anchor="middle">
    <textPath href="#oben" startOffset="50%">KERB</textPath>
  </text>
  <text font-family="Rockwell, Georgia, serif" font-weight="700" font-size="36" letter-spacing="10" fill="#f6ecd6" text-anchor="middle">
    <textPath href="#unten" startOffset="50%">MUSIK</textPath>
  </text>
  <circle cx="44" cy="200" r="4" fill="#e9c46a"/>
  <circle cx="356" cy="200" r="4" fill="#e9c46a"/>

  <g clip-path="url(#scheibe)">
    <!-- Wiese -->
    <path d="M 60,318 Q 200,282 340,318 L 340,340 L 60,340 Z" fill="#3d7a46"/>

    <!-- Kerbbaum: Stamm -->
    <rect x="196" y="118" width="8" height="184" rx="2" fill="#6b4423"/>
    <!-- Spitze -->
    <polygon points="200,78 185,104 192,104 178,130 222,130 208,104 215,104" fill="#2f6b3a"/>

    <!-- Baender -->
    <g fill="none" stroke-linecap="round" stroke-width="5">
      <path d="M 163,144 C 150,170 162,190 146,214 S 140,246 128,262" stroke="#8f1d21"/>
      <path d="M 174,148 C 166,178 178,200 166,226 S 162,262 156,282" stroke="#e9c46a"/>
      <path d="M 186,150 C 182,180 192,204 184,232 S 184,262 180,276" stroke="#2b4c7e"/>
      <path d="M 214,150 C 218,180 208,204 216,232 S 216,262 220,276" stroke="#8f1d21"/>
      <path d="M 226,148 C 234,178 222,200 234,226 S 238,262 244,282" stroke="#2b4c7e"/>
      <path d="M 237,144 C 250,170 238,190 254,214 S 260,246 272,262" stroke="#e9c46a"/>
    </g>

    <!-- Kranz -->
    <ellipse cx="200" cy="142" rx="42" ry="10" fill="none" stroke="#2f6b3a" stroke-width="8"/>
    <g fill="#8f1d21">
      <circle cx="160" cy="143" r="3"/><circle cx="174" cy="150" r="3"/>
      <circle cx="190" cy="152" r="3"/><circle cx="210" cy="152" r="3"/>
      <circle cx="226" cy="150" r="3"/><circle cx="240" cy="143" r="3"/>
    </g>

    <!-- Noten -->
    <g fill="#8f1d21" stroke="#8f1d21">
      <ellipse cx="104" cy="214" rx="9" ry="6.5" transform="rotate(-22 104 214)" stroke="none"/>
      <line x1="112" y1="211" x2="112" y2="170" stroke-width="3"/>
      <path d="M 112,170 C 116,182 128,184 124,200 C 124,188 118,184 112,182 Z" stroke="none"/>

      <ellipse cx="270" cy="216" rx="9" ry="6.5" transform="rotate(-22 270 216)" stroke="none"/>
      <ellipse cx="302" cy="206" rx="9" ry="6.5" transform="rotate(-22 302 206)" stroke="none"/>
      <line x1="278" y1="213" x2="278" y2="174" stroke-width="3"/>
      <line x1="310" y1="203" x2="310" y2="164" stroke-width="3"/>
      <polygon points="276.5,174 311.5,164 311.5,172 276.5,182" stroke="none"/>
    </g>
  </g>
  </g>
</svg>
